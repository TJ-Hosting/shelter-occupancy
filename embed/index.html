<!DOCTYPE html>
<html lang="en-CA">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Toronto shelters last night — embed card</title>
	<meta name="robots" content="noindex">
	<link rel="canonical" href="https://data.tj-hosting.ca/">
	<style>
		/* Self-contained card for an iframe (README has the snippet). Sized from the iframe's own
		   viewport so the same file works at 320×180 and 600×340. Tokens: docs/DESIGN.md. */
		@font-face {
			font-family: "Oswald";
			src: url("../vendor/oswald-5.3.0/oswald-latin-wght-normal.woff2") format("woff2");
			font-weight: 200 700;
			font-display: swap;
		}
		:root {
			color-scheme: dark;
			--ink: #08090a; --paper: #ece7dc; --paper-2: #d9d3c6; --muted: #b3afa7; --key: #e0a44f;
			--beds: #d9604a; --rooms: #9479cf; --t-beds: #4a2a24; --t-rooms: #352d52;
			--u: min(1vw, 1.778vh);	/* 1% of the card's width at 16:9 */
		}
		* { box-sizing: border-box; margin: 0; }
		html, body { height: 100%; }
		body { background: var(--ink); color: var(--paper-2); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
		a.card {
			position: relative; isolation: isolate; display: flex; flex-direction: column; justify-content: space-between;
			width: 100vw; height: 100vh; padding: calc(3.6 * var(--u)) calc(4.4 * var(--u));
			color: inherit; text-decoration: none; overflow: hidden;
		}
		.art { position: absolute; inset: 0; z-index: -2; }
		.art img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; }
		a.card::before {
			content: ""; position: absolute; inset: 0; z-index: -1;
			background: linear-gradient(90deg, rgba(8, 9, 10, 0.9) 0%, rgba(8, 9, 10, 0.78) 55%, rgba(8, 9, 10, 0.55) 100%),
				linear-gradient(180deg, transparent 35%, rgba(8, 9, 10, 0.55) 70%, rgba(8, 9, 10, 0.75) 100%);
		}
		a.card:focus-visible { outline: 2px solid var(--key); outline-offset: -4px; }
		.kicker { font: 600 calc(2.9 * var(--u))/1.25 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--key); }
		.top { display: flex; align-items: flex-end; justify-content: space-between; gap: calc(2 * var(--u)); }
		.figure { display: flex; align-items: baseline; gap: calc(2.2 * var(--u)); }
		.go { font: 600 calc(2.7 * var(--u))/1.3 ui-monospace, Consolas, monospace; letter-spacing: 0.06em; color: var(--key); text-align: right; white-space: nowrap; padding-bottom: calc(1 * var(--u)); }
		.figure b { font: 600 calc(14 * var(--u))/0.9 "Oswald", "Arial Narrow", sans-serif; color: var(--paper); letter-spacing: -0.01em; }
		.figure span { font: 500 calc(4 * var(--u))/1.15 "Oswald", "Arial Narrow", sans-serif; text-transform: uppercase; letter-spacing: 0.06em; color: var(--paper); }
		.excl { font-size: calc(2.8 * var(--u)); color: var(--paper-2); margin-top: calc(0.8 * var(--u)); }
		.rates { display: grid; grid-template-columns: 1fr 1fr; gap: calc(4 * var(--u)); }
		.rate .lbl { font: 600 calc(2.7 * var(--u))/1.2 ui-monospace, Consolas, monospace; letter-spacing: 0.12em; text-transform: uppercase; color: var(--paper-2); display: flex; align-items: center; gap: calc(1.2 * var(--u)); }
		.rate .lbl i { width: calc(2 * var(--u)); height: calc(2 * var(--u)); border-radius: 2px; }
		.rate .val { font: 600 calc(6.4 * var(--u))/1.05 "Oswald", "Arial Narrow", sans-serif; color: var(--paper); }
		.meter { height: calc(1.4 * var(--u)); border-radius: 0 3px 3px 0; margin-top: calc(0.8 * var(--u)); }
		.meter span { display: block; height: 100%; border-radius: 0 3px 3px 0; }
		.beds .meter { background: var(--t-beds); } .beds .meter span, .beds i { background: var(--beds); }
		.rooms .meter { background: var(--t-rooms); } .rooms .meter span, .rooms i { background: var(--rooms); }
		.src { font-size: calc(2.6 * var(--u)); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	</style>
</head>
<body>
	<a class="card" href="https://data.tj-hosting.ca/" target="_blank" rel="noopener" aria-label="Toronto shelter occupancy last night — open the full dashboard">
		<picture class="art" aria-hidden="true">
			<source type="image/avif" srcset="../assets/img/sh-embed-band-640.avif 640w, ../assets/img/sh-embed-band-1280.avif 1280w" sizes="100vw">
			<img src="../assets/img/sh-embed-band-640.webp" srcset="../assets/img/sh-embed-band-640.webp 640w, ../assets/img/sh-embed-band-1280.webp 1280w" sizes="100vw" alt="">
		</picture>
		<p class="kicker" id="night">Toronto shelters · loading…</p>
		<div>
			<div class="top">
				<p class="figure"><b id="people">—</b><span>people<br>served</span></p>
				<p class="go">Full dashboard<br>data.tj-hosting.ca →</p>
			</div>
			<p class="excl">City-funded shelter and overnight programs, excluding Temporary Refugee Response.</p>
		</div>
		<div class="rates">
			<div class="rate beds"><p class="lbl"><i></i>Beds occupied</p><p class="val" id="beds">—</p><div class="meter"><span id="beds-m"></span></div></div>
			<div class="rate rooms"><p class="lbl"><i></i>Rooms occupied</p><p class="val" id="rooms">—</p><div class="meter"><span id="rooms-m"></span></div></div>
		</div>
		<p class="src" id="source">Source: City of Toronto Open Data</p>
	</a>
	<script>
		(function () {
			var NUM = new Intl.NumberFormat("en-CA");
			function utc(iso) { var p = iso.split("-").map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }
			function fmt(iso, opts) { return new Intl.DateTimeFormat("en-CA", Object.assign({ timeZone: "UTC" }, opts)).format(utc(iso)); }
			function torontoToday() {
				var parts = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Toronto", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date());
				var get = function (t) { return parts.filter(function (x) { return x.type === t; })[0].value; };
				return get("year") + "-" + get("month") + "-" + get("day");
			}
			function pct(v) { return v == null ? "—" : v.toFixed(1) + "%"; }
			fetch("../data/latest.json", { cache: "no-cache" }).then(function (r) {
				if (!r.ok) throw new Error(r.status);
				return r.json();
			}).then(function (d) {
				var night = d.occupancy_date;
				var ago = Math.round((utc(torontoToday()) - utc(night)) / 86400000);
				var short = fmt(night, { month: "short", day: "numeric" });
				// Same rule as the dashboard: "Last night" only when the counted evening was yesterday in Toronto.
				document.getElementById("night").textContent = ago === 1 ? "Toronto shelters · Last night (" + short + ")" : "Toronto shelters · Night of " + short;
				document.getElementById("people").textContent = NUM.format(d.headline.people);
				document.getElementById("beds").textContent = pct(d.headline.beds.rate);
				document.getElementById("rooms").textContent = pct(d.headline.rooms.rate);
				document.getElementById("beds-m").style.width = Math.min(100, d.headline.beds.rate || 0) + "%";
				document.getElementById("rooms-m").style.width = Math.min(100, d.headline.rooms.rate || 0) + "%";
				document.getElementById("source").textContent = "Source: City of Toronto Open Data, as of " + fmt(night, { year: "numeric", month: "short", day: "numeric" });
				document.body.setAttribute("data-ready", "true");
			}).catch(function () {
				document.getElementById("night").textContent = "Toronto shelters · data unavailable";
			});
		})();
	</script>
</body>
</html>
